name: Feature Request
description: Suggest a new idea or improvement for SalahMute
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Explain the feature or improvement you have in mind.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help? (optional)
      description: Describe the real-world scenario where this would be useful.
